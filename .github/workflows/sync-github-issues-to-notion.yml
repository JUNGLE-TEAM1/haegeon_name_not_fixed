name: Sync GitHub Issues to Notion

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: read
  issues: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Sync issues to Notion
        uses: actions/github-script@v7
        env:
          NOTION_TOKEN: ${{ ntn_c40252775242s6lQcupfIAMTrnPg8KgKo5VdwUhXsoaao7 }}
          NOTION_DATABASE_ID: ${{ 7e5c234752ea4e618c2bccc3f446ee62 }}
        with:
          script: |
            const notionToken = process.env.NOTION_TOKEN;
            const databaseId = process.env.NOTION_DATABASE_ID;

            const owner = "JUNGLE-TEAM1";
            const repo = "haegeon_name_not_fixed";
            const notionVersion = "2022-06-28";

            if (!notionToken) throw new Error("Missing NOTION_TOKEN");
            if (!databaseId) throw new Error("Missing NOTION_DATABASE_ID");

            async function notion(path, method = "GET", body) {
              const res = await fetch(`https://api.notion.com/v1${path}`, {
                method,
                headers: {
                  Authorization: `Bearer ${notionToken}`,
                  "Notion-Version": notionVersion,
                  "Content-Type": "application/json",
                },
                body: body ? JSON.stringify(body) : undefined,
              });

              const text = await res.text();
              if (!res.ok) throw new Error(`${method} ${path} failed: ${res.status} ${text}`);
              return text ? JSON.parse(text) : {};
            }

            function props(issue) {
              const assignees = issue.assignees.map(a => a.login).join(", ");
              const labels = issue.labels.map(l => l.name).join(", ");

              return {
                Issue: { title: [{ text: { content: `#${issue.number} ${issue.title}` } }] },
                Number: { number: issue.number },
                State: { select: { name: issue.state } },
                "Issue URL": { url: issue.html_url },
                Assignees: { rich_text: [{ text: { content: assignees } }] },
                Labels: { rich_text: [{ text: { content: labels } }] },
                Created: { date: { start: issue.created_at } },
                Updated: { date: { start: issue.updated_at } },
                Repo: { url: `https://github.com/${owner}/${repo}` },
              };
            }

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "all",
              per_page: 100,
            });

            const onlyIssues = issues.filter(issue => !issue.pull_request);

            const existing = new Map();
            let cursor = undefined;

            do {
              const data = await notion(`/databases/${databaseId}/query`, "POST", {
                page_size: 100,
                start_cursor: cursor,
              });

              for (const page of data.results) {
                const num = page.properties?.Number?.number;
                if (typeof num === "number") existing.set(num, page.id);
              }

              cursor = data.has_more ? data.next_cursor : undefined;
            } while (cursor);

            let created = 0;
            let updated = 0;

            for (const issue of onlyIssues) {
              const pageId = existing.get(issue.number);

              if (pageId) {
                await notion(`/pages/${pageId}`, "PATCH", { properties: props(issue) });
                updated++;
              } else {
                await notion("/pages", "POST", {
                  parent: { database_id: databaseId },
                  properties: props(issue),
                });
                created++;
              }
            }

            console.log(`Synced ${onlyIssues.length} issues. Created: ${created}, Updated: ${updated}`);

name: Notion Issue Sync

on:
  workflow_dispatch:
  issues:
    types:
      - opened
      - edited
      - closed
      - reopened
      - assigned
      - unassigned
      - labeled
      - unlabeled
  schedule:
    - cron: "4,9,14,19,24,29,34,39,44,49,54,59 * * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: notion-issue-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Sync issues both ways
        uses: actions/github-script@v7
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        with:
          script: |
            const notionToken = process.env.NOTION_TOKEN;
            const databaseId = process.env.NOTION_DATABASE_ID;
            const owner = "JUNGLE-TEAM1";
            const repo = "haegeon_name_not_fixed";
            const notionVersion = "2022-06-28";
            const toleranceMs = 3000;

            console.log(`Event: ${context.eventName}`);
            console.log(`Ref: ${context.ref}`);
            console.log(`SHA: ${context.sha}`);

            if (!notionToken) throw new Error("Missing NOTION_TOKEN");
            if (!databaseId) throw new Error("Missing NOTION_DATABASE_ID");

            async function notion(path, method = "GET", body) {
              const res = await fetch(`https://api.notion.com/v1${path}`, {
                method,
                headers: {
                  Authorization: `Bearer ${notionToken}`,
                  "Notion-Version": notionVersion,
                  "Content-Type": "application/json",
                },
                body: body ? JSON.stringify(body) : undefined,
              });

              const text = await res.text();
              if (!res.ok) throw new Error(`${method} ${path} failed: ${res.status} ${text}`);
              return text ? JSON.parse(text) : {};
            }

            function textProp(value) {
              return {
                rich_text: value
                  ? [{ type: "text", text: { content: String(value) } }]
                  : [],
              };
            }

            function dateProp(value) {
              return { date: value ? { start: value } : null };
            }

            function getTitle(page) {
              return (page.properties.Issue?.title || [])
                .map((t) => t.plain_text || t.text?.content || "")
                .join("");
            }

            function cleanTitle(title, number) {
              return title.replace(new RegExp(`^#${number}\\s*`), "").trim();
            }

            function getState(page) {
              return page.properties.State?.select?.name;
            }

            function issueToNotionProps(issue, source) {
              return {
                Issue: {
                  title: [{ type: "text", text: { content: `#${issue.number} ${issue.title}` } }],
                },
                Number: { number: issue.number },
                State: { select: { name: issue.state } },
                "Issue URL": { url: issue.html_url },
                Assignees: textProp(issue.assignees.map((a) => a.login).join(", ")),
                Labels: textProp(issue.labels.map((l) => l.name).join(", ")),
                Created: dateProp(issue.created_at),
                Updated: dateProp(issue.updated_at),
                Repo: { url: `https://github.com/${owner}/${repo}` },
                "Last Synced At": dateProp(new Date().toISOString()),
                "Last GitHub Updated": dateProp(issue.updated_at),
                "Last Sync Source": { select: { name: source } },
                "Sync Error": textProp(""),
              };
            }

            async function listGithubIssues() {
              const issues = await github.paginate(github.rest.issues.listForRepo, {
                owner,
                repo,
                state: "all",
                per_page: 100,
              });

              return issues.filter((issue) => !issue.pull_request);
            }

            async function listNotionRows() {
              const rows = [];
              let cursor;

              do {
                const body = { page_size: 100 };
                if (cursor) body.start_cursor = cursor;

                const data = await notion(`/databases/${databaseId}/query`, "POST", body);
                rows.push(...data.results);
                cursor = data.has_more ? data.next_cursor : undefined;
              } while (cursor);

              return rows;
            }

            const githubIssues = await listGithubIssues();
            const notionRows = await listNotionRows();

            const notionByNumber = new Map();
            for (const page of notionRows) {
              const number = page.properties.Number?.number;
              if (typeof number === "number") notionByNumber.set(number, page);
            }

            let created = 0;
            let githubToNotion = 0;
            let notionToGithub = 0;
            let unchanged = 0;

            for (const issue of githubIssues) {
              const page = notionByNumber.get(issue.number);

              if (!page) {
                await notion("/pages", "POST", {
                  parent: { database_id: databaseId },
                  properties: issueToNotionProps(issue, "GitHub"),
                });
                created++;
                continue;
              }

              const notionTitle = cleanTitle(getTitle(page), issue.number);
              const notionState = getState(page);

              const validNotionState =
                notionState === "open" || notionState === "closed"
                  ? notionState
                  : issue.state;

              const titleDiff = Boolean(notionTitle) && notionTitle !== issue.title;
              const stateDiff = validNotionState !== issue.state;

              if (!titleDiff && !stateDiff) {
                unchanged++;
                continue;
              }

              const notionEditedAt = new Date(page.last_edited_time);
              const githubUpdatedAt = new Date(issue.updated_at);

              const notionIsNewer =
                notionEditedAt.getTime() + toleranceMs >= githubUpdatedAt.getTime();

              if (notionIsNewer) {
                const patch = {};

                if (titleDiff) patch.title = notionTitle;
                if (stateDiff) patch.state = validNotionState;

                const result = await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: issue.number,
                  ...patch,
                });

                await notion(`/pages/${page.id}`, "PATCH", {
                  properties: issueToNotionProps(result.data, "Notion"),
                });

                notionToGithub++;
              } else {
                await notion(`/pages/${page.id}`, "PATCH", {
                  properties: issueToNotionProps(issue, "GitHub"),
                });

                githubToNotion++;
              }
            }

            console.log(`Created: ${created}`);
            console.log(`GitHub -> Notion: ${githubToNotion}`);
            console.log(`Notion -> GitHub: ${notionToGithub}`);
            console.log(`Unchanged: ${unchanged}`);
